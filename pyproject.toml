[project]
name = "threat-intel"
version = "0.1.0"
description = "Threat intelligence aggregator that correlates IOCs from OTX, AbuseIPDB, and URLhaus and generates executive reports using a local LLM."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ollama>=0.6.1",
    "pandas>=3.0.2",
    "python-dotenv>=1.2.2",
    "requests>=2.33.1",
    "rich>=14.3.4",
    "streamlit>=1.56.0",
    "typer>=0.24.1",
]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "pip-audit>=2.10.1",
    "pytest>=9.0.3",
    "ruff>=0.15.18",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[project.scripts]
threat-intel = "threat_intel.cli:app"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.hatch.build.targets.wheel]
packages = ["src/threat_intel"]
